name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Stage plugin zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP/PromptRun/PromptRun"
          New-Item -ItemType Directory -Force "$stage/Images" | Out-Null
          Copy-Item src/PromptRun/bin/Release/net10.0-windows10.0.26100.0/PromptRun.dll $stage/
          Copy-Item src/PromptRun/plugin.json $stage/
          Copy-Item src/PromptRun/Images/* $stage/Images/
          Compress-Archive -Path "$stage/*" -DestinationPath "$env:RUNNER_TEMP/PromptRun.zip"
          Get-ChildItem "$env:RUNNER_TEMP/PromptRun.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/PromptRun.zip
